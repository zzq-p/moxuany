server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 200
      min-spare: 20
ruoyi:
  profile: ${FOOD_UPLOAD_PATH:./.runtime/uploads}
spring:
  datasource:
    druid:
      master:
        url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/${MYSQL_DATABASE:moxuany}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia%2FShanghai
        username: ${MYSQL_USER:moxuany}
        password: ${MYSQL_PASSWORD}
      maxActive: 40
      minIdle: 5
      maxWait: 3000
      statViewServlet:
        enabled: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:}
      database: 1
      timeout: 2s
token:
  secret: ${TOKEN_SECRET}
logging:
  level:
    com.ruoyi: info
food:
  demo-enabled: ${FOOD_DEMO_ENABLED:false}
  web-login-enabled: ${FOOD_WEB_LOGIN_ENABLED:true}
  mock-payment-enabled: ${FOOD_MOCK_PAYMENT_ENABLED:true}
  appid: ${WECHAT_APPID:}
  secret: ${WECHAT_SECRET:}
  subscriptions-enabled: ${FOOD_SUBSCRIPTIONS_ENABLED:false}
  message-environment: ${FOOD_MESSAGE_ENVIRONMENT:formal}
  # 只有部署在会覆盖 X-Real-IP 的反向代理后面时才设为 true；否则该请求头可被伪造以绕过限流。
  trust-proxy-header: ${FOOD_TRUST_PROXY_HEADER:false}

  baidu-map-ak: ${BAIDU_MAP_AK:}
